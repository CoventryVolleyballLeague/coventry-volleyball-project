<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coventry Volleyball League — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playpen+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1c2b4a;
    --gold: #e0a83e;
    --cream: #faf7f1;
    --text: #2b2b2b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }

  .login-card {
    text-align: center;
    width: 100%;
    max-width: 380px;
  }

  .login-card h1 {
    font-family: "Playpen Sans", cursive;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    line-height: 1.3;
    color: var(--navy);
  }

  form {
    margin-top: 2.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }

  .field {
    text-align: left;
  }

  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 0.4rem;
  }

  .field input {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    padding: 0.7rem 0.9rem;
    border: 2px solid #d8d0bf;
    border-radius: 8px;
    background: white;
  }

  .field input:focus {
    outline: none;
    border-color: var(--gold);
  }

  .error {
    display: none;
    color: #b3261e;
    font-size: 0.85rem;
    text-align: left;
  }

  .error.visible {
    display: block;
  }

  button[type="submit"] {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    padding: 0.85rem 1.75rem;
    border-radius: 999px;
    cursor: pointer;
    border: 2px solid var(--navy);
    background: var(--navy);
    color: white;
    transition: transform 0.15s ease;
  }

  button[type="submit"]:hover {
    transform: translateY(-2px);
  }

  .back-link {
    display: inline-block;
    margin-top: 1.5rem;
    color: var(--muted, #6b7280);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<div class="login-card">
  <h1>Please enter Admin credentials</h1>

  <form id="credentialsForm">
    <div class="field">
      <label for="adminName">Your Name *</label>
      <input type="text" id="adminName" name="adminName" autocomplete="name" placeholder="e.g. Mani">
      <p class="error" id="nameErrorMsg">Please enter your name.</p>
    </div>

    <div class="field">
      <label for="username">Admin Username</label>
      <input type="text" id="username" name="username" autocomplete="username">
    </div>

    <div class="field">
      <label for="password">Admin Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
    </div>

    <p class="error" id="errorMsg">Incorrect credentials 😞 Let's Try again!!!</p>

    <button type="submit">Login</button>
  </form>

  <a class="back-link" href="index.html">&larr; Back</a>
</div>

<script>
  document.getElementById("credentialsForm").addEventListener("submit", (event) => {
    event.preventDefault();
    const adminName = document.getElementById("adminName").value.trim();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const errorMsg = document.getElementById("errorMsg");
    const nameErrorMsg = document.getElementById("nameErrorMsg");
    errorMsg.classList.remove("visible");
    nameErrorMsg.classList.remove("visible");

    const isRegularAdmin = username === "Coventry123" && password === "PaintersWay123$";
    const isSuperUser = username === "Mani123" && password === "Mani123$";

    if (!isRegularAdmin && !isSuperUser) {
      errorMsg.classList.add("visible");
      return;
    }

    // Regular admins must identify themselves so log entries can always be
    // attributed to a person. The super user's identity is implied by their
    // credentials, so this step is skipped for them.
    if (isRegularAdmin && !adminName) {
      nameErrorMsg.classList.add("visible");
      document.getElementById("adminName").focus();
      return;
    }

    sessionStorage.setItem("role", "admin");
    sessionStorage.setItem("adminName", isSuperUser ? "Mani" : adminName);
    if (isSuperUser) {
      sessionStorage.setItem("isSuperUser", "true");
    } else {
      sessionStorage.removeItem("isSuperUser");
    }
    location.href = "dashboard.html";
  });
</script>

</body>
</html>
