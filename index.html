<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coventry Volleyball League — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playpen+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1c2b4a;
    --gold: #e0a83e;
    --cream: #faf7f1;
    --text: #2b2b2b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }

  .login-card {
    text-align: center;
    max-width: 640px;
  }

  .login-card h1 {
    font-family: "Playpen Sans", cursive;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(1.8rem, 4.5vw, 2.8rem);
    line-height: 1.3;
    color: var(--navy);
  }

  .login-card h1 .tagline {
    display: block;
    margin-top: 0.5rem;
    color: var(--gold);
    font-size: clamp(0.9rem, 2vw, 1.15rem);
    font-weight: 600;
  }

  .buttons {
    margin-top: 2.5rem;
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .buttons button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    padding: 0.85rem 1.75rem;
    border-radius: 999px;
    cursor: pointer;
    border: 2px solid var(--navy);
    transition: transform 0.15s ease;
  }

  .buttons button:hover {
    transform: translateY(-2px);
  }

  .btn-guest {
    background: var(--navy);
    color: white;
  }

  .btn-admin {
    background: transparent;
    color: var(--navy);
  }
</style>
</head>
<body>

<div class="login-card">
  <h1>Welcome to Coventry Volleyball League<span class="tagline">... where community meets competition</span></h1>

  <div class="buttons">
    <button class="btn-guest" id="guestBtn">Continue as guest</button>
    <button class="btn-admin" id="adminBtn">Continue as Admin</button>
  </div>
</div>

<script>
  document.getElementById("guestBtn").addEventListener("click", () => {
    sessionStorage.setItem("role", "guest");
    location.href = "dashboard.html";
  });

  document.getElementById("adminBtn").addEventListener("click", () => {
    location.href = "admin-login.html";
  });
</script>

</body>
</html>
